name: Windows DX12 capture build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-capture.yml
      - CMakeLists.txt
      - src/capture.cpp
      - src/depth_capture.cpp
      - src/depth_capture.hpp
      - tests/depth_capture_test.cpp
      - shaders/native_detail_ao.hlsl
      - README.md
      - third_party/reshade/LICENSE.md
      - third_party/imgui/LICENSE.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build capture add-on
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $dxc = Get-ChildItem "$sdk/*/x64/dxc.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$dxc) { throw 'DirectX Shader Compiler was not found in the Windows SDK.' }
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DZZZ_AO_BUILD_COMPUTE=OFF -DZZZ_AO_TEST_DEPTH_CAPTURE=ON "-DDXC_EXECUTABLE=$($dxc.FullName)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target zzz_ao_capture zzz_ao_depth_capture_test
      - name: Test D3D12 depth readback
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package focused build
        run: |
          New-Item -Type Directory -Path package
          Copy-Item build/Release/zzz_ao_capture.addon64 package/
          Copy-Item README.md package/
          Copy-Item third_party/reshade/LICENSE.md package/ReShade-LICENSE.md
          Copy-Item third_party/imgui/LICENSE.txt package/Dear-ImGui-LICENSE.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zzz-ao-dx12-capture
          path: package/
          if-no-files-found: error
