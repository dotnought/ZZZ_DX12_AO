name: Windows DX12 capture build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-capture.yml
      - CMakeLists.txt
      - src/capture.cpp
      - README.md
      - third_party/reshade/LICENSE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build capture add-on
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DZZZ_AO_BUILD_COMPUTE=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target zzz_ao_capture
      - name: Package focused build
        run: |
          New-Item -Type Directory -Path package
          Copy-Item build/Release/zzz_ao_capture.addon64 package/
          Copy-Item README.md package/
          Copy-Item third_party/reshade/LICENSE.md package/ReShade-LICENSE.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zzz-ao-dx12-capture
          path: package/
          if-no-files-found: error
